<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <style>
        input { display:block; margin:8px 0; padding:6px; width:250px; }
        #output { margin-top:20px; font-size:16px; }
    </style>
</head>
<body>
    <h2>Shopping Cart</h2>

    <input type="text" id="itemName" placeholder="Item Name">
    <input type="number" id="itemPrice" placeholder="Price">
    <input type="number" id="itemQty" placeholder="Quantity">
    <button onclick="addItem()">Add Item</button>

    <input type="text" id="coupon" placeholder="Enter Coupon (SAVE20 / DISC10)">
    <button onclick="applyCoupon()">Apply Coupon</button>

    <div id="output"></div>

    <script>
        class Cart {
            constructor() { this.items = []; this.discount = 0; }

            addItem(name, price, qty) {
                this.items.push({ name, price, qty });
            }

            getTotal() {
                let total = this.items.reduce((sum, item) => sum + item.price * item.qty, 0);
                return total - (total * this.discount) / 100;
            }

            applyCoupon(code) {
                const reg = /^(SAVE|DISC)(\d{1,2})$/;
                const match = code.match(reg);
                if (match) this.discount = Number(match[2]);
                else this.discount = 0;
            }
        }

        const cart = new Cart();

        function addItem() {
            const name = document.getElementById("itemName").value;
            const price = Number(document.getElementById("itemPrice").value);
            const qty = Number(document.getElementById("itemQty").value);
            cart.addItem(name, price, qty);
            display();
        }

        function applyCoupon() {
            const code = document.getElementById("coupon").value.trim();
            cart.applyCoupon(code);
            display();
        }

        function display() {
            const total = cart.getTotal();
            const list = cart.items.map(i => `${i.name} - ₹${i.price} x ${i.qty}`).join("<br>");
            document.getElementById("output").innerHTML =
                `Items:<br>${list}<br><br>Total After Discount: ₹${total}`;
        }
    </script>
</body>
</html>
