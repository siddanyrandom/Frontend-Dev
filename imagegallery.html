<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery with Modal</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .gallery img { width: 100%; cursor: pointer; border-radius: 6px; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; }
    .modal-content { background: #fff; padding: 10px; border-radius: 8px; max-width: 80%; }
    .modal-content img { width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Image Gallery</h2>

  <div class="gallery" id="gallery">
    <img src="https://picsum.photos/300?random=1" />
    <img src="https://picsum.photos/300?random=2" />
    <img src="https://picsum.photos/300?random=3" />
    <img src="https://picsum.photos/300?random=4" />
    <img src="https://picsum.photos/300?random=5" />
    <img src="https://picsum.photos/300?random=6" />
  </div>

  <div class="modal" id="modal">
    <div class="modal-content" id="modalContent">
      <img id="modalImg" src="" />
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const modalContent = document.getElementById('modalContent');

    document.getElementById('gallery').addEventListener('click', (e) => {
      if (e.target.tagName === "IMG") {
        modalImg.src = e.target.src;
        modal.style.display = 'flex';
      }
    });

    modal.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    modalContent.addEventListener('click', (e) => {
      e.stopPropagation();
    });
  </script>
</body>
</html>
