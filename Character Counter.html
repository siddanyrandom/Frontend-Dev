<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Character Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    #counter {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }
    .yellow {
      color: #d1b000;
    }
    .red {
      color: red;
    }
    textarea {
      width: 100%;
      height: 120px;
      font-size: 16px;
      padding: 10px;
    }
    button {
      margin-top: 15px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Live Character Counter</h2>

  <textarea id="textArea" maxlength="100"></textarea>
  <span id="counter">100 characters remaining</span>

  <button id="resetBtn">Reset</button>

  <script>
    const textArea = document.getElementById("textArea");
    const counter = document.getElementById("counter");
    const resetBtn = document.getElementById("resetBtn");
    const maxChars = 100;

    textArea.addEventListener("input", () => {
      const remaining = maxChars - textArea.value.length;

      counter.textContent = `${remaining} characters remaining`;

      counter.classList.remove("yellow", "red");
      if (remaining <= 0) {
        counter.classList.add("red");
      } else if (remaining <= 20) {
        counter.classList.add("yellow");
      }
    });

    textArea.addEventListener("keydown", (e) => {
      if (textArea.value.length >= maxChars && e.key !== "Backspace" && e.key !== "Delete") {
        e.preventDefault();
      }
    });

    resetBtn.addEventListener("click", () => {
      textArea.value = "";
      counter.textContent = `${maxChars} characters remaining`;
      counter.classList.remove("yellow", "red");
    });
  </script>
</body>
</html>
