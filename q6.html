<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>My Photo Gallery</title>
  <link rel="stylesheet" href="q6.css">

      <img src="https://picsum.photos/seed/pic3/400/300" alt="Dog Portrait">

      <div class="caption">Waves of Freedom</div>
    </div>

    <div class="photo">
      <img src="https://picsum.photos/seed/pic5/400/300" alt="Desert Landscape">
      <div class="caption">Desert Mirage</div>
    </div>

    <div class="photo">
      <img src="https://picsum.photos/seed/pic6/400/300" alt="Snowy Trees">

  <footer>
    <p>© 2025 Siddhartha Saxena Kanojia | My Photography Collection</p>
