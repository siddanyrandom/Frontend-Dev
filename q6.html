<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="q6.css" />
</head>
<body>
  <header>
    <h1>CSS Transformations Showcase</h1>
  </header>

  <main>
    <section class="container">
      <!-- Rotate Box -->
      <div class="transform-box rotate">
        <div class="box"></div>
        <p>rotate()</p>
      </div>

      <!-- Scale Box -->
      <div class="transform-box scale">
        <div class="box"></div>
        <p>scale()</p>
      </div>

      <!-- Translate Box -->
      <div class="transform-box translate">
        <div class="box"></div>
        <p>translate()</p>
      </div>

      <!-- Skew Box -->
      <div class="transform-box skew">
        <div class="box"></div>
        <p>skew()</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 CSS Transformations Demo</p>
  </footer>
</body>
</html>
