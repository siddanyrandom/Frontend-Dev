<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outline and Focus Styling Form</title>
  <link rel="stylesheet" href="q9.css" />
</head>
<body>
  <header>
    <h1>Outline and Focus Styling Form</h1>
  </header>

  <main>
    <section class="form-section">
      <form class="styled-form">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" />

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" />

        <label for="message">Message:</label>
        <textarea id="message" rows="4" placeholder="Write your message..."></textarea>

        <button type="submit">Submit</button>
      </form>

      <div class="note">
        <p>
          This form demonstrates <strong>outline styles</strong>, 
          <em>outline-offset</em>, and focus states. 
          Try clicking inside each field to see the different focus outlines.
        </p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Outline and Focus Styling Demo</p>
  </footer>
</body>
</html>
