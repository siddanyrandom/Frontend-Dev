<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
    <header>
        <h1>Filter Comparison Layout</h1>
    </header>

    <main class="comparison-container">
        <figure class="image-box">
            <img src="https://picsum.photos/500/350?random=1" alt="Original Image">
            <figcaption>Before (Original)</figcaption>
        </figure>

        <figure class="image-box filtered">
            <img src="https://picsum.photos/500/350?random=1" alt="Filtered Image">
            <figcaption>After (Brightness Applied)</figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2025 Filter Comparison Example</p>
    </footer>
</body>
</html>
