<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span Example</title>
</head>
<body>
    <p>
        Today I am feeling <span style="color: green;">happy</span>, 
        because I completed my <span style="font-weight: bold;">coding project</span>. 
        Later, I plan to <span style="font-style: italic;">read a book</span> and relax.
    </p>
</body>
</html>
