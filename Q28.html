<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>
<body>

        <tbody>
            <tr>
                <td>Mathematics</td>
                <td>100</td>
                <td>95</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>100</td>
                <td>88</td>
            </tr>
            <tr>
                <td>English</td>
                <td>100</td>
                <td>92</td>
            </tr>
            <tr>
                <td>History</td>
                <td>100</td>
                <td>85</td>
            </tr>
            <tr>
                <td>Computer Science</td>
                <td>100</td>
                <td>98</td>
            </tr>
            <tr>
                <td colspan="2" title="Total Marks of all subjects">Total</td>

            </tr>
            <tr>
                <td colspan="2" title="Percentage of total marks">Percentage</td>
                <td>91.6%</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
