<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme Switcher</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111;
      --accent: #0b84ff;
    }
    body.theme-light {
      --bg: #ffffff;
      --text: #111;
      --accent: #0b84ff;
    }
    body.theme-dark {
      --bg: #111218;
      --text: #e6e6e6;
      --accent: #ffb86b;
    }
    body.theme-blue {
      --bg: #e8f2ff;
      --text: #04293a;
      --accent: #0b84ff;
    }
    body {
      margin: 40px;
      font-family: system-ui;
      background: var(--bg);
      color: var(--text);
      transition: 0.2s ease;
    }
    .card {
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      max-width: 520px;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: none;
      cursor: pointer;
      font-weight: 600;
    }
    .current {
      margin-top: 10px;
      font-weight: 700;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Theme Switcher</h1>

    <div class="buttons">
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
      <button data-theme="blue">Blue</button>
    </div>

    <div class="current" id="currentTheme"></div>
  </div>

  <script>
    const body = document.body;
    const currentThemeEl = document.getElementById('currentTheme');
    const prefix = 'theme-';

    function applyTheme(theme) {
      body.setAttribute('class', prefix + theme);
      body.setAttribute('data-theme', theme);
      localStorage.setItem('site-theme', theme);
      currentThemeEl.textContent = theme;
    }

    (function() {
      const saved = localStorage.getItem('site-theme') || 'light';
      applyTheme(saved);
    })();

    document.querySelector('.buttons').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      applyTheme(btn.getAttribute('data-theme'));
    });
  </script>
</body>
</html>
