<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borders and Padding Demonstration</title>

  <!-- Link to external CSS -->
  <link rel="stylesheet" href="q1.css" />
</head>
<body>
  <header>
    <h1>Borders and Padding Demonstration</h1>
  </header>

  <main>
    <section class="container">
      <!-- Each box demonstrates a unique border and padding style -->
      <div class="box solid-border">Solid Border</div>
      <div class="box dashed-border">Dashed Border</div>
      <div class="box double-border">Double Border</div>
      <div class="box groove-border">Groove Border</div>
      <div class="box rounded-border">Rounded Corners</div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Borders & Padding Demo</p>
  </footer>
</body>
</html>
