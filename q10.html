<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q10 – Mini User Interface Layout</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>
    <header>
        <h1>Mini UI Layout</h1>
    </header>

    <main>
        <section class="card">
            <img src="https://placehold.co/150x150" alt="Profile Image" class="profile-img">

            <form class="user-form">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">

                <div class="button-group">
                    <button type="submit" class="btn primary">Submit</button>
                    <button type="reset" class="btn secondary">Reset</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>Q10 – Complete Mini User Interface Layout Demo</p>
    </footer>
</body>
</html>
