<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frameset Layout (Modern Equivalent)</title>
</head>
<body>
  <table border="1" width="100%" height="100%">
    <tr height="80">
      <td align="center">
        <a href="#home">Home</a> |
        <a href="#about">About</a> |
        <a href="#contact">Contact</a>
      </td>
    </tr>
    <tr>
      <td align="center">
        <h2 id="home">Welcome to My Website</h2>
        <div id="about">
          <h2>About Page</h2>
          <p>This is the About section.</p>
        </div>
        <div id="contact">
          <h2>Contact Page</h2>
          <p>This is the Contact section.</p>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
