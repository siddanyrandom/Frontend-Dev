<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>
    <header>
        <h1>My Photo Gallery</h1>
    </header>

    <main class="gallery">
        <figure>
            <img src="https://picsum.photos/400?random=1" alt="Gallery Image 1">
            <figcaption>Mountain View</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/400?random=2" alt="Gallery Image 2">
            <figcaption>City Lights</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/400?random=3" alt="Gallery Image 3">
            <figcaption>Forest Trail</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/400?random=4" alt="Gallery Image 4">
            <figcaption>Sunny Beach</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/400?random=5" alt="Gallery Image 5">
            <figcaption>Desert Dunes</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/400?random=6" alt="Gallery Image 6">
            <figcaption>Snowy Peaks</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/400?random=7" alt="Gallery Image 7">
            <figcaption>Night Sky</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/400?random=8" alt="Gallery Image 8">
            <figcaption>Lake Reflection</figcaption>
        </figure>
    </main>
</body>
</html>
