<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <header>
        <h1>Responsive Image Filter Gallery</h1>
    </header>

    <main>
        <section class="gallery">
            <figure>
                <img src="https://picsum.photos/400?random=1" alt="Mountain View">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/400?random=2" alt="Beach View">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/400?random=3" alt="City View">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/400?random=4" alt="Forest Path">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/400?random=5" alt="Desert Dunes">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/400?random=6" alt="Colorful Sunset">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Responsive Gallery Example</p>
    </footer>
</body>
</html>
