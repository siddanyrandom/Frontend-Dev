<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q7 – UI Components Page</title>
    <link rel="stylesheet" href="q7.css">
</head>
<body>
    <div class="ui-container">
        <h1>User Interface Components</h1>

        <div class="ui-card">
            <!-- Search Bar -->
            <div class="search-bar">
                <input type="text" placeholder="Search something...">
                <button class="primary-btn">Search</button>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button class="primary-btn">Primary</button>
                <button class="secondary-btn">Secondary</button>
                <button class="outline-btn">Outline</button>
            </div>

            <!-- Dropdown Menu -->
            <div class="dropdown">
                <select>
                    <option selected disabled>Choose an option</option>
                    <option>Profile</option>
                    <option>Settings</option>
                    <option>Logout</option>
                </select>
            </div>
        </div>
    </div>
</body>
</html>
