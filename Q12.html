<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Formatting Example</title>
</head>
<body>
    <p>
        Learning to code is <strong>essential</strong> in today’s digital world. 
        It allows you to <em>express your creativity</em> and solve real-world problems. 
        Sometimes, you might feel stuck, but <mark>practice and patience</mark> can make a huge difference.<br>
        Remember, even small improvements matter, so keep going! <small>Updated just now</small>
    </p>
</body>
</html>
