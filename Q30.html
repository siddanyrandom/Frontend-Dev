<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection</title>
</head>
<body>
    <h1>Travel Preferences</h1>

    <form>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="india" selected>India</option>
            <option value="france">France</option>
            <option value="japan">Japan</option>
            <option value="brazil">Brazil</option>
        </select>
        <br><br>

        <label for="state">State:</label>
        <select id="state" name="state">
            <option value="maharashtra" selected>Maharashtra</option>
            <option value="karnataka">Karnataka</option>
            <option value="uttar-pradesh">Uttar Pradesh</option>
        </select>
        <br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option value="mumbai" selected>Mumbai</option>
            <option value="pune">Pune</option>
            <option value="nagpur">Nagpur</option>
        </select>
        <br><br>

        <label for="tourist">Favorite Tourist Place:</label>
        <select id="tourist" name="tourist">
            <option value="gateway" selected>Gateway of India</option>
            <option value="taj-mahal">Taj Mahal</option>
            <option value="red-fort">Red Fort</option>
        </select>
    </form>

    <p>You have chosen to travel in <strong>India</strong>, specifically <em>Maharashtra</em>, visiting the city <strong>Mumbai</strong> and your favorite tourist spot is <em>Gateway of India</em>.</p>
</body>
</html>
