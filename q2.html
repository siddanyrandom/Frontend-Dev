<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Height and Width Practice Layout</title>
  <link rel="stylesheet" href="q2.css" />
</head>
<body>
  <header>
    <h1>Height and Width Practice Layout</h1>
  </header>

  <main>
    <section class="container">
      <!-- Box 1: Fixed width and height in px -->
      <div class="box box1">
        Fixed size (px)
      </div>

      <!-- Box 2: Percentage-based width, min-height, and overflow demo -->
      <div class="box box2">
        Responsive size (%)  
        <p>This box demonstrates min-height, max-width, and overflow. Resize the window to test.</p>
      </div>

      <!-- Box 3: Viewport and em units -->
      <div class="box box3">
        Viewport-based (vh & em)
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Height & Width Practice</p>
  </footer>
</body>
</html>
