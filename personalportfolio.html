<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="personal-portfolio.css">
</head>
<body class="bg-light text-dark">
  <header class="text-center p-5 bg-white shadow-sm">
    <h1 class="fw-bold">Siddhartha Saxena Kanojia</h1>
    <p class="lead mb-0">Aspiring Software Engineer | DevOps Enthusiast</p>
  </header>

  <main>
    <section class="container text-center mt-4">
      <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Profile" class="img-fluid rounded-circle mb-3">
      <div class="mb-4">
        <button class="btn btn-primary me-2">Hire Me</button>
        <button class="btn btn-outline-dark">Download CV</button>
      </div>

      <div class="p-5 bg-white rounded shadow-sm mx-auto" style="max-width: 500px;">
        <h3 class="fw-bold mb-3">Contact Me</h3>
        <form>
          <input type="text" class="form-control mb-3" placeholder="Your Name">
          <input type="email" class="form-control mb-3" placeholder="Your Email">
          <textarea class="form-control mb-3" rows="3" placeholder="Your Message"></textarea>
          <button type="submit" class="btn btn-success w-100">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="text-center mt-5 py-3 bg-dark text-white">
    <p class="mb-0">© 2025 Siddhartha Saxena Kanojia. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
