<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="task-tracker.css">
</head>
<body>

  <header class="bg-primary text-white text-center py-4">
    <h1 class="fw-bold">Task Tracker</h1>
    <p class="lead mb-0">
      Total Pending Tasks 
      <span class="badge bg-warning text-dark">3</span>
    </p>
  </header>

  <main class="container my-5">
    <div class="card shadow-sm p-4">
      <h3 class="text-primary fw-semibold mb-4 text-center">Today's Tasks</h3>

      <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Complete project documentation
          <span class="badge bg-danger">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Review team feedback
          <span class="badge bg-warning text-dark">Medium</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Update website footer
          <span class="badge bg-success">Low</span>
        </li>
      </ul>

      <div class="text-center mt-4">
        <button class="btn btn-success">
          Completed <span class="badge bg-light text-success">2</span>
        </button>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2025 Task Tracker | All Rights Reserved</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
