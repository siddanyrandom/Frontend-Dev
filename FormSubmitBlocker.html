<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Submit Blocker</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    form { max-width: 350px; }
    input { width: 100%; padding: 10px; margin-top: 5px; }
    .field { margin-bottom: 15px; }
    .error { color: red; font-size: 14px; display: none; }
    #success { color: green; font-weight: bold; margin-top: 15px; display: none; }
  </style>
</head>
<body>
  <h2>Form Validation</h2>

  <form id="form">
    <div class="field">
      <label>Name</label>
      <input type="text" id="name">
      <div class="error" id="errName">Name is required</div>
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email">
      <div class="error" id="errEmail">Enter a valid email</div>
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password">
      <div class="error" id="errPass">Password must be at least 6 characters</div>
    </div>

    <button type="submit">Submit</button>
  </form>

  <div id="success">Form Submitted Successfully</div>

  <script>
    const form = document.getElementById('form');
    const nameF = document.getElementById('name');
    const emailF = document.getElementById('email');
    const passF = document.getElementById('password');
    const errName = document.getElementById('errName');
    const errEmail = document.getElementById('errEmail');
    const errPass = document.getElementById('errPass');
    const success = document.getElementById('success');

    function validate() {
      let valid = true;

      if (nameF.value.trim() === '') {
        errName.style.display = 'block';
        valid = false;
      } else errName.style.display = 'none';

      if (!emailF.value.includes('@')) {
        errEmail.style.display = 'block';
        valid = false;
      } else errEmail.style.display = 'none';

      if (passF.value.length < 6) {
        errPass.style.display = 'block';
        valid = false;
      } else errPass.style.display = 'none';

      return valid;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      success.style.display = 'none';
      if (validate()) success.style.display = 'block';
    });

    form.addEventListener('input', validate);
  </script>
</body>
</html>
