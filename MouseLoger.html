<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mouse Path & Coordinates Logger</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .box { width: 400px; height: 400px; border: 2px solid #333; position: relative; user-select: none; }
    .coords { margin-top: 10px; font-weight: 600; }
    .dot { width: 10px; height: 10px; background: red; border-radius: 50%; position: absolute; transform: translate(-50%, -50%); }
  </style>
</head>
<body>
  <h2>Mouse Path & Coordinates Logger</h2>
  <div class="box" id="box"></div>
  <div class="coords">clientX: <span id="cx">-</span> px, clientY: <span id="cy">-</span> px</div>
  <script>
    const box = document.getElementById('box');
    const cx = document.getElementById('cx');
    const cy = document.getElementById('cy');

    box.addEventListener('mousemove', (e) => {
      cx.textContent = e.clientX;
      cy.textContent = e.clientY;
    });

    box.addEventListener('dblclick', (e) => {
      const rect = box.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.left = x + 'px';
      dot.style.top = y + 'px';
      box.appendChild(dot);
    });
  </script>
</body>
</html>
