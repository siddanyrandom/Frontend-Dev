<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Entities Example</title>
</head>
<body>
  <p>
    Displaying special characters using HTML entities:<br><br>
    Less than: &lt;<br>
    Greater than: &gt;<br>
    Ampersand: &amp;<br>
    Double quote: &quot;<br>
    Single quote: &apos;<br><br>
    Copyright: &copy;<br>
    Trademark: &trade;<br>
    Registered: &reg;
  </p>
</body>
</html>
