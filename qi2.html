<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Embedded Google Map</title>
</head>
<body>
  <h2>My University Location</h2>

  <!-- The loading="lazy" attribute tells the browser to load the iframe content only

    title="GLA University, Mathura"
    width="80%"
    height="450"
    style="border:0;"
    allowfullscreen=""
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

</body>
</html>
