<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 – Image Showcase Layout</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <header>
        <h1>Responsive Image Showcase</h1>
    </header>

    <main>
        <section class="gallery">
            <figure>
                <img src="https://placehold.co/400x250/89CFF0/FFFFFF?text=Mountain" alt="Mountain">
                <figcaption>Beautiful Mountain</figcaption>
            </figure>
            <figure>
                <img src="https://placehold.co/400x250/6495ED/FFFFFF?text=Lake" alt="Lake">
                <figcaption>Serene Lake</figcaption>
            </figure>
            <figure>
                <img src="https://placehold.co/400x250/40E0D0/FFFFFF?text=Forest" alt="Forest">
                <figcaption>Forest Path</figcaption>
            </figure>
            <figure>
                <img src="https://placehold.co/400x250/FFB347/FFFFFF?text=Sunset" alt="Sunset">
                <figcaption>Golden Sunset</figcaption>
            </figure>
            <figure>
                <img src="https://placehold.co/400x250/FF6F61/FFFFFF?text=City" alt="City">
                <figcaption>City Lights</figcaption>
            </figure>
            <figure>
                <img src="https://placehold.co/400x250/77DD77/FFFFFF?text=Beach" alt="Beach">
                <figcaption>Quiet Beach</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>Created for Q3 – Image Showcase Layout</p>
    </footer>
</body>
</html>
