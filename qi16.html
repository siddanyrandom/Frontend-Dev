<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URI Encoding Example</title>
</head>
<body>
  <h2>URI Encoding Demonstration</h2>
  <p>Original URL (with special characters):</p>
  <p><code>https://example.com/search?query=HTML & CSS</code></p>

  <p>Correctly encoded URL:</p>
  <a href="https://example.com/search?query=HTML%20%26%20CSS" target="_blank">
    https://example.com/search?query=HTML%20%26%20CSS
  </a>

  <p>This link uses <code>%20</code> for spaces and <code>%26</code> for the ampersand (&) symbol.</p>
</body>
</html>
