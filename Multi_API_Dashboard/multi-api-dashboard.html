<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-API Dashboard</title>
    <link rel="stylesheet" href="multi-api-dashboard.css">
</head>

<body>

    <h2>Multi-API Dashboard (Fetch + Promise.all)</h2>

    <div id="warning" class="warning"></div>

    <div class="dash-container">

        <div class="card">
            <h3>Total Users</h3>
            <p id="usersCount" class="number skeleton"></p>
        </div>

        <div class="card">
            <h3>Total Orders</h3>
            <p id="ordersCount" class="number skeleton"></p>
        </div>

        <div class="card">
            <h3>Total Products</h3>
            <p id="productsCount" class="number skeleton"></p>
        </div>

    </div>

    <script src="multi-api-dashboard.js"></script>
</body>
</html>
